AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: OccasionFun e-commerce backend (separate from HalloweenReady)

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  NamePrefix:
    Type: String
    Default: occasionfun
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Resource name prefix. Must stay occasionfun on this branch so HalloweenReady tables/Lambdas are never touched.
  BrandName:
    Type: String
    Default: OccasionFun
  SiteUrl:
    Type: String
    Default: https://www.occasionfun.com
  EmailDomain:
    Type: String
    Default: occasionfun.com
    Description: SES identity domain (DKIM records must be added at the registrar)
  SmtpHost:
    Type: String
    Default: mail.occasionfun.com
  SmtpUser:
    Type: String
    Default: order@occasionfun.com
  SmtpFrom:
    Type: String
    Default: order@occasionfun.com
  NotifyEmail:
    Type: String
    Default: order@occasionfun.com,order@usarakhi.com,priya.yadav@mydgv.com
  SesFromEmail:
    Type: String
    Default: email@occasionfun.com
  SesReplyTo:
    Type: String
    Default: email@occasionfun.com
  MarketingSmtpUser:
    Type: String
    Default: order@occasionfun.com
  MarketingFromEmail:
    Type: String
    Default: email@occasionfun.com
  DomainName:
    Type: String
    Default: occasionfun.com
  StripeSecretArn:
    Type: String
    Default: ""
  StripeSecretKey:
    Type: String
    Default: ""
    NoEcho: true
  StripeWebhookSecret:
    Type: String
    Default: ""
    NoEcho: true
  RazorpaySecretArn:
    Type: String
    Default: ""
  RazorpayKeyId:
    Type: String
    Default: ""
    NoEcho: true
  RazorpayKeySecret:
    Type: String
    Default: ""
    NoEcho: true
  RazorpayWebhookSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Razorpay webhook signing secret (Dashboard → Webhooks). Required so captured payments mark orders paid without relying on browser redirect.
  SmtpPassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: SMTP password for order@occasionfun.com (contact & order emails)
  MarketingSmtpPassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: Marketing SMTP password (Mailercloud) for /admin/email campaigns
  UspsClientId:
    Type: String
    Default: ""
    NoEcho: true
  UspsClientSecret:
    Type: String
    Default: ""
    NoEcho: true
  UspsSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN with { clientId, clientSecret, ... }
  UspsBaseUrl:
    Type: String
    Default: "https://apis.usps.com"
  UspsCrid:
    Type: String
    Default: ""
  UspsMid:
    Type: String
    Default: ""
  UspsEpsAccountNumber:
    Type: String
    Default: ""
    NoEcho: true
  UspsPaymentAuthorizationToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional USPS payment authorization token for label purchase (leave empty if unused)
  LoadTestMode:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: When true, stub Stripe/Razorpay/USPS/SMTP for k6 load tests (staging only)
  EnableVendorApi:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Deploy Orange County vendor HTTP API (optional; leave false for OccasionFun)
  OrangeCountyVendorApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: API key for Orange County vendor order feed (X-Vendor-Api-Key); only used when EnableVendorApi=true
  WhatsAppToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Meta WhatsApp Cloud API permanent token (optional)
  WhatsAppPhoneNumberId:
    Type: String
    Default: ""
    Description: Meta WhatsApp phone number ID (optional)
  WhatsAppTemplateName:
    Type: String
    Default: ""
    Description: Optional approved Meta template name for out-of-session messages
  WhatsAppTemplateLang:
    Type: String
    Default: "en"
  TwilioAccountSid:
    Type: String
    Default: ""
    NoEcho: true
  TwilioAuthToken:
    Type: String
    Default: ""
    NoEcho: true
  TwilioWhatsAppFrom:
    Type: String
    Default: ""
    Description: e.g. whatsapp:+14155238886 (optional Twilio WhatsApp sender)
  CjApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: CJ Dropshipping API Key (My CJ → Authorization → API). Not the website password.

Conditions:
  VendorApiEnabled: !Equals [!Ref EnableVendorApi, "true"]

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 29
    MemorySize: 1024
    Architectures: [arm64]
    Environment:
      Variables:
        PRODUCTS_TABLE: !Ref ProductsTable
        ORDERS_TABLE: !Ref OrdersTable
        CARTS_TABLE: !Ref CartsTable
        CUSTOMERS_TABLE: !Ref CustomersTable
        EVENTS_TABLE: !Ref EventsTable
        CONFIG_TABLE: !Ref ConfigTable
        EMAIL_CAMPAIGNS_TABLE: !Ref EmailCampaignsTable
        REMINDER_EMAILS_TABLE: !Ref ReminderEmailsTable
        PENDING_PAYMENT_UNSUB_TABLE: !Ref PendingPaymentUnsubTable
        UPLOAD_BUCKET: !Ref UploadBucket
        USER_POOL_ID: !Ref UserPool
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
        ENVIRONMENT: !Ref Environment
        NAME_PREFIX: !Ref NamePrefix
        LOAD_TEST_MODE: !Ref LoadTestMode
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
        RAZORPAY_SECRET_ARN: !Ref RazorpaySecretArn
        RAZORPAY_KEY_ID: !Ref RazorpayKeyId
        RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret
        RAZORPAY_WEBHOOK_SECRET: !Ref RazorpayWebhookSecret
        CLOUDFRONT_DOMAIN: !GetAtt CloudFrontDistribution.DomainName
        SMTP_HOST: !Ref SmtpHost
        SMTP_PORT: "465"
        SMTP_SECURE: "true"
        SMTP_USER: !Ref SmtpUser
        SMTP_FROM: !Ref SmtpFrom
        NOTIFY_EMAIL: !Ref NotifyEmail
        SMTP_PASS: !Ref SmtpPassword
        SITE_URL: !Ref SiteUrl
        SES_AWS_REGION: us-east-1
        # Legacy SES_* names used only as marketing From fallbacks — keep as verified Sender ID.
        SES_FROM_EMAIL: !Ref SesFromEmail
        SES_REPLY_TO: !Ref SesReplyTo
        # Marketing only (Mailercloud). Never point at the transactional SMTP_* mailbox.
        MARKETING_TRANSPORT: smtp
        MARKETING_SMTP_HOST: smtp-prod.mailrcld.com
        MARKETING_SMTP_PORT: "587"
        MARKETING_SMTP_SECURE: "false"
        MARKETING_SMTP_USER: !Ref MarketingSmtpUser
        MARKETING_SMTP_PASS: !Ref MarketingSmtpPassword
        MARKETING_FROM_EMAIL: !Ref MarketingFromEmail
        USPS_CLIENT_ID: !Ref UspsClientId
        USPS_CLIENT_SECRET: !Ref UspsClientSecret
        USPS_SECRET_ARN: !Ref UspsSecretArn
        USPS_BASE_URL: !Ref UspsBaseUrl
        USPS_CRID: !Ref UspsCrid
        USPS_MID: !Ref UspsMid
        USPS_EPS_ACCOUNT_NUMBER: !Ref UspsEpsAccountNumber
        USPS_PAYMENT_AUTHORIZATION_TOKEN: !Ref UspsPaymentAuthorizationToken
        ORANGE_COUNTY_VENDOR_API_KEY: !Ref OrangeCountyVendorApiKey
        WHATSAPP_TOKEN: !Ref WhatsAppToken
        WHATSAPP_PHONE_NUMBER_ID: !Ref WhatsAppPhoneNumberId
        WHATSAPP_TEMPLATE_NAME: !Ref WhatsAppTemplateName
        WHATSAPP_TEMPLATE_LANG: !Ref WhatsAppTemplateLang
        TWILIO_ACCOUNT_SID: !Ref TwilioAccountSid
        TWILIO_AUTH_TOKEN: !Ref TwilioAuthToken
        TWILIO_WHATSAPP_FROM: !Ref TwilioWhatsAppFrom
        CJ_API_KEY: !Ref CjApiKey
        CJ_IMPORT_WORKER_FUNCTION: !Sub ${NamePrefix}-cj-import-${Environment}

Resources:
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${NamePrefix}-products-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${NamePrefix}-orders-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${NamePrefix}-carts-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${NamePrefix}-customers-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${NamePrefix}-events-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${NamePrefix}-config-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  EmailCampaignsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${NamePrefix}-email-campaigns-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  ReminderEmailsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${NamePrefix}-reminder-emails-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  # Opt-out list for pending-payment reminder emails only (not SES marketing).
  PendingPaymentUnsubTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${NamePrefix}-pending-payment-unsub-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${NamePrefix}-uploads-${Environment}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ["*"]
            MaxAge: 3600


  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${UploadBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${NamePrefix}-oac-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${NamePrefix} product media CDN (${Environment})
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt UploadBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingOptimized — long TTL, no query/cookie forwarding (images are immutable keys).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  SesDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref EmailDomain
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${NamePrefix}-users-${Environment}
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: !Sub Verify your ${BrandName} account
        EmailMessage: !Sub |
          Welcome to ${BrandName}!

          Your verification code is {####}.

          This code expires in 24 hours. If you did not create an account, you can ignore this email.

          — ${BrandName} Team
          ${SiteUrl}
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${NamePrefix}-web-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: Admin portal access

  SuperAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: super-admin
      UserPoolId: !Ref UserPool
      Description: Super admin — full admin access plus delete testing records

  EmailGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: email
      UserPoolId: !Ref UserPool
      Description: Legacy email group — marketing email is now under /admin/email for all admins

  VendorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: vendor
      UserPoolId: !Ref UserPool
      Description: Vendor portal — sees only their assigned orders, inventory, and warehouses

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${NamePrefix}-api-${Environment}
      Handler: index.handler
      CodeUri: ..
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EmailCampaignsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReminderEmailsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PendingPaymentUnsubTable
        - S3CrudPolicy:
            BucketName: !Ref UploadBucket
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - ssm:GetParameter
              Resource: "*"
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
                - ses:SendTemplatedEmail
                - ses:SendBulkEmail
                - ses:SendBulkTemplatedEmail
                - sesv2:SendEmail
                - sesv2:SendBulkEmail
                - ses:GetAccountSendingEnabled
                - sesv2:GetAccount
                - sesv2:GetEmailIdentity
              Resource: "*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NamePrefix}-cj-import-${Environment}
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        ApiHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
    Metadata:
      BuildMethod: makefile

  CjImportWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${NamePrefix}-cj-import-${Environment}
      Handler: cj-import-worker.handler
      CodeUri: ..
      Timeout: 900
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - S3CrudPolicy:
            BucketName: !Ref UploadBucket
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NamePrefix}-cj-import-${Environment}
    Metadata:
      BuildMethod: makefile

  # Upload-time WebP variants (thumb/card/gallery/zoom). S3 event → EventBridge → Lambda.
  # Not Lambda@Edge: peak GET traffic must not pay for resize.
  ImageOptimizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${NamePrefix}-image-optimize-${Environment}
      Handler: index.handler
      CodeUri: ..
      Timeout: 120
      MemorySize: 2048
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref UploadBucket
      Events:
        ObjectCreated:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - !Ref UploadBucket
    Metadata:
      BuildMethod: makefile

  # Optional Orange County vendor order feed (EnableVendorApi=true). Off by default for OccasionFun.
  # Storefront/admin traffic stays on HttpApi — vendors cannot reach those routes here.
  #
  # Retain policies: do NOT delete this API if the stack is updated/replaced or this
  # resource is temporarily removed — keeps the vendor Base URL stable.
  # Never rename the logical ID `VendorHttpApi` (that forces a new API id / URL).
  VendorHttpApi:
    Type: AWS::Serverless::HttpApi
    Condition: VendorApiEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${NamePrefix}-vendor-http-api-${Environment}
      StageName: !Ref Environment
      CorsConfiguration:
        AllowMethods: ["GET", "POST", "OPTIONS"]
        AllowHeaders: ["Content-Type", "X-Vendor-Api-Key"]
        AllowOrigins: ["*"]

  VendorApiFunction:
    Type: AWS::Serverless::Function
    Condition: VendorApiEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub ${NamePrefix}-vendor-api-${Environment}
      Handler: vendor-api.handler
      CodeUri: ..
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
          ENVIRONMENT: !Ref Environment
          ORANGE_COUNTY_VENDOR_API_KEY: !Ref OrangeCountyVendorApiKey
          SITE_URL: !Ref SiteUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt OrdersTable.Arn
                - !Sub "${OrdersTable.Arn}/index/*"
      Events:
        VendorListOrders:
          Type: HttpApi
          Properties:
            ApiId: !Ref VendorHttpApi
            Path: /vendors/orange-county/orders
            Method: GET
        VendorGetOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref VendorHttpApi
            Path: /vendors/orange-county/orders/{orderId}
            Method: GET
        VendorPostShipment:
          Type: HttpApi
          Properties:
            ApiId: !Ref VendorHttpApi
            Path: /vendors/orange-county/orders/{orderId}/shipment
            Method: POST
        VendorPostTracking:
          Type: HttpApi
          Properties:
            ApiId: !Ref VendorHttpApi
            Path: /vendors/orange-county/orders/{orderId}/tracking
            Method: POST
        VendorPostShipmentByBody:
          Type: HttpApi
          Properties:
            ApiId: !Ref VendorHttpApi
            Path: /vendors/orange-county/shipment
            Method: POST
        VendorPostTrackingByBody:
          Type: HttpApi
          Properties:
            ApiId: !Ref VendorHttpApi
            Path: /vendors/orange-county/tracking
            Method: POST
        VendorHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref VendorHttpApi
            Path: /health
            Method: GET
    Metadata:
      BuildMethod: makefile

  ReviewEmailsCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${NamePrefix}-review-emails-${Environment}
      Handler: scheduled.handler
      Timeout: 180
      MemorySize: 512
      CodeUri: ..
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PendingPaymentUnsubTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      Events:
        EmailJobsEvery15Minutes:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: Review emails + abandoned cart + pending-payment reminders
            Enabled: true
        RazorpayReconcileHourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Reconcile Razorpay captured payments stuck in pending_payment (webhook safety net)
            Enabled: true
            Input: '{"task":"razorpayReconcile"}'
        HomepageRankingHourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Rebuild homepage product ranking snapshot from daily rollups
            Enabled: true
            Input: '{"task":"homepageRanking"}'
    Metadata:
      BuildMethod: makefile

  SesEmailCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${NamePrefix}-ses-email-${Environment}
      Handler: ses-scheduled.handler
      Timeout: 120
      MemorySize: 512
      CodeUri: ..
      Environment:
        Variables:
          EMAIL_CAMPAIGNS_TABLE: !Ref EmailCampaignsTable
          CONFIG_TABLE: !Ref ConfigTable
          ENVIRONMENT: !Ref Environment
          SITE_URL: !Ref SiteUrl
          SES_AWS_REGION: us-east-1
          SES_FROM_EMAIL: !Ref SesFromEmail
          SES_REPLY_TO: !Ref SesReplyTo
          MARKETING_FROM_EMAIL: !Ref MarketingFromEmail
          MARKETING_TRANSPORT: smtp
          MARKETING_SMTP_HOST: smtp-prod.mailrcld.com
          MARKETING_SMTP_PORT: "587"
          MARKETING_SMTP_SECURE: "false"
          MARKETING_SMTP_USER: !Ref MarketingSmtpUser
          MARKETING_SMTP_PASS: !Ref MarketingSmtpPassword
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmailCampaignsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
                - sesv2:SendEmail
                - sesv2:SendBulkEmail
                - sesv2:GetAccount
              Resource: "*"
      Events:
        EveryMinuteSesQueue:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Description: SES campaign scheduler + queue sender (respects daily/rate limits)
            Enabled: true
    Metadata:
      BuildMethod: makefile

  BounceSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${NamePrefix}-bounce-sync-${Environment}
      Handler: bounce-sync.handler
      Timeout: 120
      MemorySize: 512
      CodeUri: ..
      Environment:
        Variables:
          EMAIL_CAMPAIGNS_TABLE: !Ref EmailCampaignsTable
          ENVIRONMENT: !Ref Environment
          SITE_URL: !Ref SiteUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmailCampaignsTable
      Events:
        HourlyBounceSync:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Promote hard-bounced marketing recipients onto SUPPRESS# skip list
            Enabled: true
    Metadata:
      BuildMethod: makefile

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub ${NamePrefix}-http-api-${Environment}
      StageName: !Ref Environment
      CorsConfiguration:
        AllowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
        AllowHeaders: ["Content-Type", "Authorization", "X-Session-Id"]
        AllowOrigins: ["*"]

Outputs:
  ApiUrl:
    Description: HTTP API endpoint (storefront + admin — not for vendors)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  VendorApiUrl:
    Condition: VendorApiEnabled
    Description: Orange County vendor order API only (X-Vendor-Api-Key)
    Value: !Sub https://${VendorHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  ProductsTableName:
    Value: !Ref ProductsTable
  OrdersTableName:
    Value: !Ref OrdersTable
  CartsTableName:
    Value: !Ref CartsTable
  CustomersTableName:
    Value: !Ref CustomersTable
  EventsTableName:
    Value: !Ref EventsTable
  ConfigTableName:
    Value: !Ref ConfigTable
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UploadBucketName:
    Value: !Ref UploadBucket
  CloudFrontDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
  CdnUrl:
    Description: HTTPS origin for product images (set NEXT_PUBLIC_CDN_URL to this)
    Value: !Sub https://${CloudFrontDistribution.DomainName}
  SiteUrl:
    Value: !Ref SiteUrl
  NamePrefix:
    Value: !Ref NamePrefix
  SesIdentity:
    Description: Verify this domain in GoDaddy with the DKIM CNAMEs from SES
    Value: !Ref EmailDomain
  DkimToken1:
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenName1
  DkimValue1:
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenValue1
  DkimToken2:
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenName2
  DkimValue2:
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenValue2
  DkimToken3:
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenName3
  DkimValue3:
    Value: !GetAtt SesDomainIdentity.DkimDNSTokenValue3
